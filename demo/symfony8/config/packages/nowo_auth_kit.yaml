nowo_auth_kit:
    user_class: App\Entity\User
    user_identifier_field: email
    registration_mode: first_user_only
    registration_role: ROLE_USER
    login_success_route: demo_home
    # Remember-me checkbox on the sign-in page (firewall remember_me in security.yaml).
    remember_me:
        enabled: true
    # Mailed / QR / OAuth callback links use this origin, never the request Host (password-reset poisoning hardening).
    absolute_url:
        base_uri: '%env(DEFAULT_URI)%'
    locale:
        # both: /en/login (canonical) + /login (_unlocalized)
        # unlocalized: redirect → 302 to /{default|current}/…
        # switch to "serve" to render bare URLs with locale.default instead
        in_path: both
        default: en
        enabled: [en, es]
        unlocalized: redirect
    embed:
        mode: dropdown
    password_reset:
        mode: enabled
        delivery: both
        token_field: passwordResetToken
        token_expires_field: passwordResetExpiresAt
    magic_login:
        mode: enabled
        lifetime: 600
        max_uses: 1
    # QR phone login: desktop challenge page (UiKit auth scaffold + bundled poller; endroid/qr-code renders the SVG).
    qr_login:
        mode: enabled
    # Invitations (1.32): /{_locale}/admin/invitations to invite, resend and revoke; the invitee accepts on the
    # registration form (e-mail locked). The demo has no mailer, so the link is shown once to the inviter.
    invitations:
        mode: enabled
        show_link_when_undelivered: true
        security:
            # The first demo account is the administrator (App\Doctrine\FirstUserAdministratorListener).
            access_roles: [ROLE_ADMIN]
    # Two-factor authentication (1.34): authenticator apps + recovery codes; administrators must enrol (7-day grace).
    # The TOTP secret is #[Encrypted] (nowo-tech/doctrine-encrypt-bundle, key generated in dev).
    mfa:
        enabled: true
        issuer: 'AuthKit Demo'
        required_roles: [ROLE_ADMIN]
        admin:
            routes: true
            access_roles: [ROLE_ADMIN]
    # Several accounts at once (1.34): avatar menu switcher on the home page, /{_locale}/accounts chooser. Needs UserKit
    # sessions (config/packages/nowo_user_kit.yaml).
    multi_account:
        enabled: true
        # 1.35: avatars in the switcher (carol: a picture, ada: a broken URL, dave: an http: URL the policy drops).
        # The other accounts of the browser show initials (chooser.other_account_avatars: false).
        presenter: App\Security\DemoAccountPresenter
    # REQ-UI-003 page contract: the auth pages render on nowo_ui_kit.layouts.guest (config/packages/nowo_ui_kit.yaml);
    # per-profile overrides live under web_ui (layout_template, templates.<page>, form_themes, brand, qr_login).
    # Optional: composer require nowo-tech/slide-to-confirm-bundle (PHP 8.2+)
    # slide_to_confirm:
    #     enabled: true
    #     registration_consent: gate
    #     qr_login_approve: danger
    # Optional: composer require nowo-tech/device-intelligence-bundle (PHP 8.3+)
    # device_intelligence:
    #     enabled: true
    #     new_device_notify: true
    #     device_rate_limit: true
    #     qr_login:
    #         approve_require_trusted: true
    # Optional: composer require nowo-tech/otp-input-bundle (PHP 8.2+)
    # otp_input:
    #     enabled: true
    #     password_reset_code: true
    # Legacy-host opt-ins (1.30+), all off by default:
    # locale: { unlocalized_route_suffix: .default }      # bare twins named <route>.default
    # routes: { logout: { methods: [POST] } }              # with security.yaml logout.enable_csrf: true
    # password_reset: { after_request_route: app_check_email, token_in_session: true }
    # doctrine: { register_mapping: auto }                 # auth_kit_* entities only with social/QR login
    # routing: { skip_disabled_features: true }            # no routes for disabled flows
