security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: auto

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            # Demo: accounts with ROLE_DISABLED are refused (sign-in and account switch).
            user_checker: App\Security\DemoUserChecker
            remember_me:
                secret: '%kernel.secret%'
                remember_me_parameter: login_form[_remember_me]
                signature_properties: [password]
            form_login:
                login_path: nowo_auth_kit_login
                check_path: nowo_auth_kit_login
                default_target_path: demo_home
                enable_csrf: true
                username_parameter: login_form[_username]
                password_parameter: login_form[_password]
                csrf_parameter: login_form[_csrf_token]
                csrf_token_id: authenticate
            logout:
                path: nowo_auth_kit_logout
                target: nowo_auth_kit_login
                invalidate_session: true
                enable_csrf: true
            login_link:
                check_route: nowo_auth_kit_magic_login_check
                # The password hash voids pending links on a password change; the lifetime covers admin-issued links
                # (magic_login.admin_link.lifetime, 3600 s) - what bin/console nowo:auth-kit:configure-security writes.
                signature_properties: [email, password]
                lifetime: 3600
                max_uses: 1
                default_target_path: demo_home

    access_control:
        # 1.34: account chooser and switch (also for a browser whose active session ended); MFA challenge under /login.
        - { path: ^/((en|es)/)?accounts, roles: PUBLIC_ACCESS }
        - { path: ^/_demo/, roles: PUBLIC_ACCESS }
        - { path: ^/((en|es)/)?account/, roles: ROLE_USER }
        - { path: ^/(en|es)/admin/mfa, roles: ROLE_ADMIN }
        - { path: ^/(en|es)/login, roles: PUBLIC_ACCESS }
        - { path: ^/(en|es)/register, roles: PUBLIC_ACCESS }
        - { path: ^/(en|es)/reset-password, roles: PUBLIC_ACCESS }
        - { path: ^/(en|es)/reset-password/reset, roles: PUBLIC_ACCESS }
        - { path: ^/(en|es)/reset-password/complete, roles: PUBLIC_ACCESS }
        - { path: ^/(en|es)/magic-login, roles: PUBLIC_ACCESS }
        - { path: ^/(en|es)/invitation, roles: PUBLIC_ACCESS }
        - { path: ^/invitation, roles: PUBLIC_ACCESS }
        - { path: ^/(en|es)/admin/invitations, roles: ROLE_ADMIN }
        - { path: ^/admin/invitations, roles: ROLE_ADMIN }
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/register, roles: PUBLIC_ACCESS }
        - { path: ^/reset-password, roles: PUBLIC_ACCESS }
        - { path: ^/magic-login, roles: PUBLIC_ACCESS }
        - { path: ^/(en|es)/home, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
