doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
    orm:
        # matches the snake_case columns of the migrations (password_reset_token, …)
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App
