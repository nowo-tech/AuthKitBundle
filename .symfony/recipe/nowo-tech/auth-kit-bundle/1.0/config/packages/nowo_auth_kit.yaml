nowo_auth_kit:
    default_profile: default
    profiles:
        default:
            user_class: App\Entity\User
            user_identifier_field: email
            registration_mode: first_user_only
            registration_role: ROLE_USER
            # remember_me:
            #     enabled: true
            #     lifetime: 604800
            #     path: /
            # password_strength:
            #     enabled: true
            #     level: medium
            #     policy_mode: level
            # slide_to_confirm:
            #     enabled: true
            #     registration_consent: gate
            #     qr_login_approve: danger
            # device_intelligence:
            #     enabled: true
            #     new_device_notify: true
            #     device_rate_limit: true
            #     qr_login:
            #         approve_require_trusted: true
            # magic_login:
            #     mode: enabled
            #     lifetime: 600
            #     max_uses: 1
    default_locale: en
    enabled_locales: [en, es]

when@prod:
    nowo_auth_kit:
        # Fail compile if Login Throttle Bundle is missing (Flex also requires the package).
        login_throttle_required: true
