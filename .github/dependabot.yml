# Dependabot configuration for automated dependency updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    versioning-strategy: widen
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 5
    reviewers:
      - "HecFranco"
    labels:
      - "dependencies"
      - "php"
    groups:
      symfony:
        patterns:
          - "symfony/*"
      phpstan:
        patterns:
          - "phpstan/*"
          - "rector/rector"
    commit-message:
      prefix: "chore(deps):"
    ignore:
      # PHPUnit 12 needs PHP 8.3 and PHPUnit 13 needs PHP 8.4; the bundle supports PHP 8.2+.
      # Drop this once the PHP floor reaches 8.4.
      - dependency-name: "phpunit/phpunit"
        versions: [">= 12.0"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 3
    reviewers:
      - "HecFranco"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci):"
