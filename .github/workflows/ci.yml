name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  git-hygiene:
    name: Git history (no Cursor co-author)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for Cursor co-author trailers (REQ-GIT-001)
        run: |
          chmod +x .scripts/check-no-cursor-coauthor.sh
          ./.scripts/check-no-cursor-coauthor.sh HEAD

  test:
    name: PHP ${{ matrix.php }} - Symfony ${{ matrix.symfony }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        # REQ-SF-002: Symfony 8.0 reached end of maintenance (July 2026) and every symfony/* 8.0.x release
        # carries security advisories that Composer refuses to install, so the 8.0 cell is dropped;
        # composer.json keeps allowing ^8.0 (REQ-SF-001). Symfony 8.x requires PHP >= 8.4.
        symfony: ['7.4', '8.1']
        exclude:
          - php: '8.2'
            symfony: '8.1'
          - php: '8.3'
            symfony: '8.1'

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json
          coverage: pcov
          tools: composer:v2

      - run: composer validate --strict

      - name: Install dependencies
        run: |
          # REQ-SF-002: pin every symfony/* package of composer.json to the cell's minor, so a "7.4" cell
          # cannot float to 8.x through caret ranges.
          CONSTRAINT='${{ matrix.symfony }}.*'
          PACKAGES=$(jq -r --arg c "$CONSTRAINT" '(.require + ."require-dev") | keys[] | select(startswith("symfony/") and (startswith("symfony/polyfill-") | not)) | . + ":" + $c' composer.json)
          composer require $PACKAGES --no-interaction --no-update
          composer update --with-all-dependencies --no-interaction --prefer-dist
          # Transitive Symfony components (event-dispatcher, error-handler, ...) must follow the same minor, or a
          # 7.4 framework-bundle runs on 8.x components and trips their deprecations (REQ-SF-005).
          EXTRA=$(composer show --format=json | jq -r --arg c "$CONSTRAINT" '.installed[] | select(.name | startswith("symfony/")) | select(.version | test("^v?(7|8)\\.")) | .name + ":" + $c')
          composer require $EXTRA --no-interaction --no-update
          composer update --with-all-dependencies --no-interaction --prefer-dist
      - name: Composer audit (Critical/High)
        run: composer audit --locked


      - run: composer test

      - name: Validate 100% coverage
        if: matrix.php == '8.2' && matrix.symfony == '7.4'
        run: |
          composer test-coverage
          php scripts/check-coverage.php coverage.xml --min-percent=100

  code-style-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
      - run: composer update --prefer-dist --no-interaction
      - run: composer cs-check
      - run: composer phpstan
      - run: composer igor
      - run: php .scripts/validate-translations.php
      - name: No raw form elements in Twig (REQ-TWIG-005)
        run: bash .scripts/check-no-raw-html-form.sh

  real-databases:
    name: Sign-in transaction on PostgreSQL and MySQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-placeholder
          POSTGRES_DB: auth_kit
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-placeholder
          MYSQL_DATABASE: auth_kit
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pci-placeholder" --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: json, pdo_pgsql, pdo_mysql
          tools: composer:v2
      - run: composer update --prefer-dist --no-interaction
      - name: PostgreSQL
        env:
          AUTH_KIT_TEST_DB_URL: postgresql://postgres:ci-placeholder@127.0.0.1:5432/auth_kit?serverVersion=17&charset=utf8
        run: vendor/bin/phpunit --no-coverage tests/Integration/ProgrammaticLogin/SwallowedDatabaseErrorKernelTest.php
      - name: MySQL
        env:
          AUTH_KIT_TEST_DB_URL: mysql://root:ci-placeholder@127.0.0.1:3306/auth_kit?serverVersion=8.4.0&charset=utf8mb4
        run: vendor/bin/phpunit --no-coverage tests/Integration/ProgrammaticLogin/SwallowedDatabaseErrorKernelTest.php

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: json
          coverage: pcov
          tools: composer:v2
      - run: composer update --prefer-dist --no-interaction
      - run: composer test-coverage
      - run: php scripts/check-coverage.php coverage.xml --min-percent=100
