name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  git-hygiene:
    name: Git history (no Cursor co-author)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for Cursor co-author trailers (REQ-GIT-001)
        run: |
          chmod +x .scripts/check-no-cursor-coauthor.sh
          ./.scripts/check-no-cursor-coauthor.sh HEAD

  test:
    name: PHP ${{ matrix.php }} - Symfony ${{ matrix.symfony }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        # REQ-SF-002: Symfony 8.0 reached end of maintenance (July 2026) and every symfony/* 8.0.x release
        # carries security advisories that Composer refuses to install, so the 8.0 cell is dropped;
        # composer.json keeps allowing ^8.0 (REQ-SF-001). Symfony 8.x requires PHP >= 8.4.
        symfony: ['7.4', '8.1']
        exclude:
          - php: '8.2'
            symfony: '8.1'
          - php: '8.3'
            symfony: '8.1'

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json
          coverage: pcov
          tools: composer:v2

      - run: composer validate --strict

      - name: Install dependencies
        run: |
          # REQ-SF-002: pin every symfony/* package of composer.json to the cell's minor, so a "7.4" cell
          # cannot float to 8.x through caret ranges.
          CONSTRAINT='${{ matrix.symfony }}.*'
          PACKAGES=$(jq -r --arg c "$CONSTRAINT" '(.require + ."require-dev") | keys[] | select(startswith("symfony/") and (startswith("symfony/polyfill-") | not)) | . + ":" + $c' composer.json)
          composer require $PACKAGES --no-interaction --no-update
          composer update --with-all-dependencies --no-interaction --prefer-dist
          # Transitive Symfony components (event-dispatcher, error-handler, ...) must follow the same minor, or a
          # 7.4 framework-bundle runs on 8.x components and trips their deprecations (REQ-SF-005).
          EXTRA=$(composer show --format=json | jq -r --arg c "$CONSTRAINT" '.installed[] | select(.name | startswith("symfony/")) | select(.version | test("^v?(7|8)\\.")) | .name + ":" + $c')
          composer require $EXTRA --no-interaction --no-update
          composer update --with-all-dependencies --no-interaction --prefer-dist
      - name: Composer audit (Critical/High)
        run: composer audit --locked


      - run: composer test

      - name: Validate 100% coverage
        if: matrix.php == '8.2' && matrix.symfony == '7.4'
        run: |
          composer test-coverage
          php scripts/check-coverage.php coverage.xml --min-percent=100

  code-style-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
      - run: composer update --prefer-dist --no-interaction
      - run: composer cs-check
      - run: composer phpstan
      - run: composer igor
      - run: php .scripts/validate-translations.php
      - name: No raw form elements in Twig (REQ-TWIG-005)
        run: bash .scripts/check-no-raw-html-form.sh

  real-databases:
    name: Sign-in transaction, GDPR ports and look-alike ids on PostgreSQL, MySQL and MariaDB
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-placeholder
          POSTGRES_DB: auth_kit
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-placeholder
          MYSQL_DATABASE: auth_kit
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pci-placeholder" --health-interval 5s --health-timeout 5s --health-retries 30
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ci-placeholder
          MARIADB_DATABASE: auth_kit
        ports: ['3307:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: json, pdo_pgsql, pdo_mysql
          tools: composer:v2
      - run: composer update --prefer-dist --no-interaction
      - name: PostgreSQL
        env:
          AUTH_KIT_TEST_DB_URL: postgresql://postgres:ci-placeholder@127.0.0.1:5432/auth_kit?serverVersion=17&charset=utf8
        run: vendor/bin/phpunit --no-coverage tests/Integration/ProgrammaticLogin/SwallowedDatabaseErrorKernelTest.php tests/Integration/HostExtensions/RevocationOnTheLockKernelTest.php && vendor/bin/phpunit --no-coverage tests/Integration/PersonalData/InvitationPersonalDataPortTest.php && vendor/bin/phpunit --no-coverage tests/Integration/PersonalData/SocialAccountPersonalDataExportTest.php && vendor/bin/phpunit --no-coverage tests/Integration/LookAlike
      - name: MySQL
        env:
          AUTH_KIT_TEST_DB_URL: mysql://root:ci-placeholder@127.0.0.1:3306/auth_kit?serverVersion=8.4.0&charset=utf8mb4
        run: vendor/bin/phpunit --no-coverage tests/Integration/ProgrammaticLogin/SwallowedDatabaseErrorKernelTest.php tests/Integration/HostExtensions/RevocationOnTheLockKernelTest.php && vendor/bin/phpunit --no-coverage tests/Integration/PersonalData/InvitationPersonalDataPortTest.php && vendor/bin/phpunit --no-coverage tests/Integration/PersonalData/SocialAccountPersonalDataExportTest.php && vendor/bin/phpunit --no-coverage tests/Integration/LookAlike
      - name: MariaDB (REQ-SEC-006 look-alike ids)
        env:
          AUTH_KIT_TEST_DB_URL: mysql://root:ci-placeholder@127.0.0.1:3307/auth_kit?serverVersion=11.4.0-MariaDB&charset=utf8mb4
        run: vendor/bin/phpunit --no-coverage tests/Integration/LookAlike

  # 1.50.0 (Beacon spec 239): two-session deadlock, lock wait and named-lock tests and a two-process stress test on real
  # servers (tests/Database). None may be skipped. 1.53.0 (REQ-RUNTIME-003): MariaDB 11.4 legs, and the HTTP conflict
  # answers (409 + CONFLICT_001 / CONFLICT_002) on every server.
  load:
    name: Load readiness (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'MySQL 8.4', url: 'mysql://root:ci-not-secret@127.0.0.1:3306/auth_kit_load?serverVersion=8.4.0&charset=utf8mb4', dbal: '' }
          - { name: 'PostgreSQL 16', url: 'postgresql://postgres:ci-not-secret@127.0.0.1:5432/auth_kit_load?serverVersion=16&charset=utf8', dbal: '' }
          - { name: 'MariaDB 11.4', url: 'mysql://root:ci-not-secret@127.0.0.1:3307/auth_kit_load?serverVersion=11.4.0-MariaDB&charset=utf8mb4', dbal: '' }
          # DBAL 3 (Symfony 7.4: Symfony 8 requires DBAL 4; savepoints on, as the test kernel sets them).
          - { name: 'MySQL 8.4, DBAL 3', url: 'mysql://root:ci-not-secret@127.0.0.1:3306/auth_kit_load?serverVersion=8.4.0&charset=utf8mb4', dbal: '^3.8.2' }
          - { name: 'PostgreSQL 16, DBAL 3', url: 'postgresql://postgres:ci-not-secret@127.0.0.1:5432/auth_kit_load?serverVersion=16&charset=utf8', dbal: '^3.8.2' }
          - { name: 'MariaDB 11.4, DBAL 3', url: 'mysql://root:ci-not-secret@127.0.0.1:3307/auth_kit_load?serverVersion=11.4.0-MariaDB&charset=utf8mb4', dbal: '^3.8.2' }
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-not-secret
          MYSQL_DATABASE: auth_kit_load
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h127.0.0.1 -uroot -pci-not-secret --silent"
          --health-interval 5s --health-timeout 5s --health-retries 30
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-not-secret
          POSTGRES_DB: auth_kit_load
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 30
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ci-not-secret
          MARIADB_DATABASE: auth_kit_load
        ports: ['3307:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: json, pdo_mysql, pdo_pgsql
          coverage: none
          tools: composer:v2

      - run: composer update --prefer-dist --no-interaction --no-progress

      - name: Use DBAL 3 (Symfony 7.4)
        if: ${{ matrix.dbal != '' }}
        run: |
          PACKAGES=$(jq -r '(.require + ."require-dev") | keys[] | select(startswith("symfony/") and (startswith("symfony/polyfill-") | not)) | . + ":7.4.*"' composer.json)
          composer require $PACKAGES "doctrine/dbal:${{ matrix.dbal }}" --no-interaction --no-update
          composer update --with-all-dependencies --no-interaction --prefer-dist --no-progress
          EXTRA=$(composer show --format=json | jq -r '.installed[] | select(.name | startswith("symfony/")) | select(.version | test("^v?(7|8)\\.")) | .name + ":7.4.*"')
          composer require $EXTRA --no-interaction --no-update
          composer update --with-all-dependencies --no-interaction --prefer-dist --no-progress

      - name: Run the lock wait, deadlock and concurrency tests
        timeout-minutes: 10
        env:
          AUTH_KIT_LOAD_DATABASE_URL: ${{ matrix.url }}
        run: vendor/bin/phpunit --no-coverage --fail-on-skipped tests/Database

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: json
          coverage: pcov
          tools: composer:v2
      - run: composer update --prefer-dist --no-interaction
      - run: composer test-coverage
      - run: php scripts/check-coverage.php coverage.xml --min-percent=100

  # Dependency floor: the code must work with the LOWEST nowo-tech/transaction-* versions composer.json allows (a host
  # can run `composer update nowo-tech/auth-kit-bundle` without updating them), and the demo lock must install what the
  # bundle requires (the demo installs from its lock, so a requirement added later is never installed and Demo smoke
  # fails with "class not found"). Same job as BreadcrumbKit (txd-constraint-1118).
  deps-floor:
    name: Dependency floor (nowo-tech/transaction-* lowest, demo lock)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Demo lock satisfies the bundle's nowo-tech requirements
        run: python3 .scripts/check-demo-lock.py . --only 'nowo-tech/*'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction

      - name: Downgrade nowo-tech/transaction-* to the lowest allowed versions
        run: |
          composer update 'nowo-tech/transaction-*' --prefer-lowest --prefer-dist --no-progress --no-interaction
          composer show 'nowo-tech/transaction-*'

      - name: PHPStan at the floor
        run: composer phpstan

      - name: Tests at the floor
        timeout-minutes: 20
        run: composer test
