name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  git-hygiene:
    name: Git history (no Cursor co-author)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for Cursor co-author trailers (REQ-GIT-001)
        run: |
          chmod +x .scripts/check-no-cursor-coauthor.sh
          ./.scripts/check-no-cursor-coauthor.sh HEAD

  test:
    name: PHP ${{ matrix.php }} - Symfony ${{ matrix.symfony }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        symfony: ['7.4', '8.0', '8.1']
        exclude:
          - php: '8.2'
            symfony: '8.0'
          - php: '8.2'
            symfony: '8.1'
          - php: '8.3'
            symfony: '8.0'
          - php: '8.3'
            symfony: '8.1'

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json
          coverage: pcov
          tools: composer:v2

      - run: composer validate --strict

      - name: Install dependencies
        run: |
          composer require \
            symfony/framework-bundle:^${{ matrix.symfony }} \
            symfony/security-bundle:^${{ matrix.symfony }} \
            symfony/form:^${{ matrix.symfony }} \
            symfony/twig-bundle:^${{ matrix.symfony }} \
            symfony/translation:^${{ matrix.symfony }} \
            symfony/routing:^${{ matrix.symfony }} \
            symfony/validator:^${{ matrix.symfony }} \
            --no-interaction --no-update
          composer update --with-all-dependencies --no-interaction --prefer-dist
      - name: Composer audit (Critical/High)
        run: composer audit --locked


      - run: composer test

      - name: Validate 100% coverage
        if: matrix.php == '8.2' && matrix.symfony == '7.4'
        run: |
          composer test-coverage
          php scripts/check-coverage.php coverage.xml --min-percent=100

  code-style-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
      - run: composer update --prefer-dist --no-interaction
      - run: composer cs-check
      - run: composer phpstan
      - run: php vendor/bin/yaml-lint src/Resources/translations

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: json
          coverage: pcov
          tools: composer:v2
      - run: composer update --prefer-dist --no-interaction
      - run: composer test-coverage
      - run: php scripts/check-coverage.php coverage.xml --min-percent=100
