services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Nowo\AuthKitBundle\:
        resource: '../../'
        exclude:
            - '../../DependencyInjection/'
            - '../../Entity/'
            - '../../Enum/'
            - '../../Form/'
            - '../../Controller/'
            - '../../QrLogin/DeviceIntelligenceQrLoginStepUp.php'
            - '../../NowoAuthKitBundle.php'

    # REQ-SF-004 rule 7: the controllers carry #[Route] and must not be autoconfigured. On Symfony >= 7.3
    # autoconfiguration tags them `routing.controller`, and the host's `controllers: { resource: routing.controllers }`
    # would then register their routes without the profile defaults of the nowo_auth_kit route loader (the only
    # documented import). Tagged explicitly instead.
    Nowo\AuthKitBundle\Controller\:
        resource: '../../Controller/'
        autoconfigure: false
        public: true
        tags: [controller.service_arguments]

    # Form Kit injects FormOptionsMerger into tagged form types (FormOptionsMergerInjectorCompilerPass).
    Nowo\AuthKitBundle\Form\:
        resource: '../../Form/'
        exclude:
            - '../../Form/PasswordFieldConstraintResolver.php'
            - '../../Form/PasswordRepeatedFieldBuilder.php'
            - '../../Form/PasswordFieldTypeResolver.php'
            - '../../Form/SlideToConfirmTypeResolver.php'
            - '../../Form/OtpInputTypeResolver.php'
            - '../../Form/DataTransformer/'
            - '../../Form/Extension/'
            - '../../Form/IdentifierConstraints.php'
            - '../../Form/FormCsrf.php'
        tags: ['form.type']

    # REQ-I18N-003: AuthKit constraint messages are translated in the NowoAuthKitBundle domain.
    Nowo\AuthKitBundle\Form\Extension\ConstraintMessageTranslationExtension: ~

    Nowo\AuthKitBundle\Form\PasswordFieldConstraintResolver:
        arguments:
            $passwordPolicy: '%nowo_auth_kit.password_policy%'

    Nowo\AuthKitBundle\Form\PasswordRepeatedFieldBuilder: ~

    # REQ-ORM-002: removed by the extension when nowo_auth_kit.doctrine.table_prefix is empty.
    Nowo\AuthKitBundle\Doctrine\TablePrefixListener:
        arguments:
            $tablePrefix: '%nowo_auth_kit.doctrine.table_prefix%'
        tags:
            - { name: doctrine.event_listener, event: loadClassMetadata }

    # SEC-004 L6: clear a pending reset credential when the identifier or password changes outside the reset flow.
    Nowo\AuthKitBundle\Doctrine\PasswordResetTokenInvalidationListener:
        tags:
            - { name: doctrine.event_listener, event: onFlush }

    # REQ-RUNTIME-001: OAuth2 token / userinfo deadlines (nowo_auth_kit.http_client).
    Nowo\AuthKitBundle\SocialLogin\OAuth2Client:
        arguments:
            $timeout: '%nowo_auth_kit.http_client.timeout%'
            $maxDuration: '%nowo_auth_kit.http_client.max_duration%'

    Nowo\AuthKitBundle\Profile\ProfileRegistry:
        arguments:
            $profiles: '%nowo_auth_kit.profiles%'
            $defaultProfileName: '%nowo_auth_kit.default_profile%'

    Nowo\AuthKitBundle\Form\PasswordFieldTypeResolver:
        arguments:
            $passwordStrength: '%nowo_auth_kit.password_strength%'

    Nowo\AuthKitBundle\Form\SlideToConfirmTypeResolver: ~

    Nowo\AuthKitBundle\Form\OtpInputTypeResolver: ~

    Nowo\AuthKitBundle\PasswordReset\PasswordResetNotifierInterface:
        alias: Nowo\AuthKitBundle\PasswordReset\NullPasswordResetNotifier

    Nowo\AuthKitBundle\MagicLogin\MagicLoginNotifierInterface:
        alias: Nowo\AuthKitBundle\MagicLogin\NullMagicLoginNotifier

    Nowo\AuthKitBundle\Routing\AuthKitRouteLocaleParameters:
        arguments:
            $localeInPath: '%nowo_auth_kit.locale.in_path%'
            $defaultLocale: '%nowo_auth_kit.locale.default%'
            $enabledLocales: '%nowo_auth_kit.locale.enabled%'

    Nowo\AuthKitBundle\Routing\AbsoluteUrlGenerator:
        arguments:
            $baseUri: '%nowo_auth_kit.absolute_url.base_uri%'

    # Links that leave the request (mails, chat payloads, share links): absolute URLs on base_uri.
    Nowo\AuthKitBundle\Routing\PublicUrlGenerator:
        arguments:
            $router: '@router'
        public: false

    nowo_auth_kit.public_url_generator:
        alias: Nowo\AuthKitBundle\Routing\PublicUrlGenerator
        public: true

    Nowo\AuthKitBundle\EventSubscriber\UnlocalizedDefaultLocaleSubscriber:
        arguments:
            $defaultLocale: '%nowo_auth_kit.locale.default%'
            $unlocalizedMode: '%nowo_auth_kit.locale.unlocalized%'
            $unlocalizedRouteSuffix: '%nowo_auth_kit.locale.unlocalized_route_suffix%'

    Nowo\AuthKitBundle\Routing\AuthKitRouteLoader:
        arguments:
            $profiles: '%nowo_auth_kit.profiles%'
            $localeInPath: '%nowo_auth_kit.locale.in_path%'
            $defaultLocale: '%nowo_auth_kit.locale.default%'
            $enabledLocales: '%nowo_auth_kit.locale.enabled%'
            $unlocalizedMode: '%nowo_auth_kit.locale.unlocalized%'
            $unlocalizedRouteSuffix: '%nowo_auth_kit.locale.unlocalized_route_suffix%'
            $skipDisabledFeatures: '%nowo_auth_kit.routing.skip_disabled_features%'
        tags:
            - { name: routing.loader }

    Nowo\AuthKitBundle\Twig\AuthKitUiExtension:
        arguments:
            $templates: '%nowo_auth_kit.templates%'
            $css: '%nowo_auth_kit.css%'
            $slideToConfirmAssets: '%nowo_auth_kit.slide_to_confirm_assets%'
            $deviceIntelligenceAssets: '%nowo_auth_kit.device_intelligence_assets%'
            $deviceIntelligenceCollectEndpoint: '%nowo_auth_kit.device_intelligence_collect_endpoint%'
            $passwordToggleAssets: '%nowo_auth_kit.password_toggle_assets%'
            $otpInputAssets: '%nowo_auth_kit.otp_input_assets%'
        tags:
            - { name: twig.extension }

    Nowo\AuthKitBundle\Controller\MagicLoginConfirmController:
        autoconfigure: false
        public: true
        tags: [controller.service_arguments]
        arguments:
            $loginLinkHandler: '@?security.authenticator.login_link_handler.main'

    Nowo\AuthKitBundle\Command\ConfigureSecurityCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $routes: '%nowo_auth_kit.routes%'
            $firewall: '%nowo_auth_kit.firewall%'
            $userClass: '%nowo_auth_kit.user_class%'
            $userIdentifierField: '%nowo_auth_kit.user_identifier_field%'
            $loginSuccessRoute: '%nowo_auth_kit.login_success_route%'
            $passwordResetMode: '%nowo_auth_kit.password_reset.mode%'
            $routeLocaleParameters: '@Nowo\AuthKitBundle\Routing\AuthKitRouteLocaleParameters'
            $loginFields: '%nowo_auth_kit.login_fields%'
            $rememberMe: '%nowo_auth_kit.remember_me%'
            $magicLogin: '%nowo_auth_kit.magic_login%'
            $socialLoginMode: '%nowo_auth_kit.social_login.mode%'

    Nowo\AuthKitBundle\Security\AuthKitAttemptLimiter:
        arguments:
            $cache: '@cache.app'
            # Optional (symfony/lock): serializes the counter read-modify-write per key.
            $lockFactory: '@?lock.factory'

    Nowo\AuthKitBundle\QrLogin\QrLoginStepUpInterface:
        alias: Nowo\AuthKitBundle\QrLogin\NullQrLoginStepUp

    Nowo\AuthKitBundle\QrLogin\DeviceIntelligenceQrLoginStepUp:
        decorates: Nowo\AuthKitBundle\QrLogin\QrLoginStepUpInterface
        arguments:
            $inner: '@.inner'

    Nowo\AuthKitBundle\DeviceIntelligence\NewDeviceLoginNotifierInterface:
        alias: Nowo\AuthKitBundle\DeviceIntelligence\NullNewDeviceLoginNotifier

    Nowo\AuthKitBundle\QrLogin\NullQrCodeGenerator: ~
    Nowo\AuthKitBundle\QrLogin\EndroidQrCodeGenerator: ~
    Nowo\AuthKitBundle\QrLogin\QrCodeGeneratorInterface:
        alias: Nowo\AuthKitBundle\QrLogin\NullQrCodeGenerator

    Nowo\AuthKitBundle\QrLogin\QrLoginChallengeManager:
        arguments:
            $kernelSecret: '%kernel.secret%'

    Nowo\AuthKitBundle\Flash\AuthKitFlashMessenger:
        arguments:
            $translator: '@?translator'
            $translate: '%nowo_auth_kit.flash.translate%'

    Nowo\AuthKitBundle\Twig\AuthKitFlashExtension:
        arguments:
            $domains: '%nowo_auth_kit.flash.twig_filter_domains%'
        tags:
            - { name: twig.extension }

    Nowo\AuthKitBundle\Locale\RecipientLocaleResolverInterface:
        alias: Nowo\AuthKitBundle\Locale\PreferredLocaleAwareRecipientLocaleResolver

    Nowo\AuthKitBundle\Locale\RecipientLocale:
        arguments:
            $localeSwitcher: '@?translation.locale_switcher'
            $enabled: '%nowo_auth_kit.recipient_locale.enabled%'
            $allowedLocales: '%nowo_auth_kit.locale.enabled%'

    # Support sign-in links issued from an administration screen (shown once or e-mailed through the host notifier).
    Nowo\AuthKitBundle\MagicLogin\AdminMagicLinkIssuer:
        arguments:
            $loginLinkHandler: '@?security.authenticator.login_link_handler.main'
            $eventDispatcher: '@?event_dispatcher'
            $lifetime: '%nowo_auth_kit.magic_login.admin_link.lifetime%'
            $protectedRoles: '%nowo_auth_kit.magic_login.admin_link.protected_roles%'

    Nowo\AuthKitBundle\Admin\AdminUserCreator:
        arguments:
            $eventDispatcher: '@?event_dispatcher'

    Nowo\AuthKitBundle\Command\CreateAdminCommand:
        arguments:
            $minPasswordLength: '%nowo_auth_kit.create_admin.min_password_length%'
            $roles: '%nowo_auth_kit.create_admin.roles%'
            $validator: '@?validator'
