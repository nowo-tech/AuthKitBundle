        title: Anmeldung fortsetzen
        heading: Magic Login abschließen
        help: Bestätigen Sie die passwortlose Anmeldung. Klicken Sie auf Weiter, um den einmaligen Link per POST zu senden (das Token wird nicht als GET-Navigation gesendet).
