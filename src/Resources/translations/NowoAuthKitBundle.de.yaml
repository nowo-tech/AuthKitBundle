        logout: Abmelden
reset:
    request:
        title: Passwort zurücksetzen
        heading: Passwort zurücksetzen
        help: Geben Sie Ihren Identifikator ein. Wenn ein Konto existiert, senden wir Anweisungen.
        submit: Anweisungen senden
        back_to_login: Zurück zur Anmeldung
        flash_sent: Wenn ein passendes Konto existiert, wurden Anweisungen gesendet.
        identifier_required: Bitte geben Sie Ihren Identifikator ein.
        field:
            identifier: E-Mail oder Benutzername
    password:
        title: Neues Passwort wählen
        heading: Neues Passwort wählen
        submit: Passwort aktualisieren
        back_to_login: Zurück zur Anmeldung
        flash_success: Ihr Passwort wurde aktualisiert. Sie können sich jetzt anmelden.
        flash_invalid_token: Dieser Link ist ungültig oder abgelaufen.
        mismatch: Die Passwörter müssen übereinstimmen.
        required: Bitte geben Sie ein Passwort ein.
        min_length: Ihr Passwort muss mindestens {{ limit }} Zeichen lang sein.
        field:
            password: Neues Passwort
            password_confirm: Neues Passwort bestätigen
    code:
        title: Passwort-Reset abschließen
        heading: Code eingeben
        help: Geben Sie den Identifikator und den erhaltenen Code ein (SMS, E-Mail oder Authenticator).
        submit: Passwort aktualisieren
        request_new: Neuen Code anfordern
        back_to_login: Zurück zur Anmeldung
        flash_invalid: Der Code ist ungültig oder abgelaufen.
        identifier_required: Bitte geben Sie Ihren Identifikator ein.
        code_required: Bitte geben Sie den Code ein.
        code_length: Der Code muss genau {{ limit }} Zeichen lang sein.
        field:
            identifier: E-Mail oder Benutzername
            code: Reset-Code

magic_login:
    request:
        title: Mit E-Mail-Link anmelden
        heading: Mit Magic Link anmelden
        help: E-Mail eingeben. Wenn ein Konto existiert, senden wir einen einmaligen Anmeldelink.
        submit: Magic Link senden
        back_to_login: Zurück zur Anmeldung
        flash_sent: Wenn ein Konto übereinstimmt, wurde ein Anmeldelink gesendet.
        identifier_required: Bitte Identifier eingeben.
        field:
            identifier: E-Mail oder Benutzername
